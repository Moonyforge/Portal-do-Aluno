
name: Validacao Docker - Portal do Aluno

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Extrair pacote de entrega
        run: tar -xzf Portal-do-Aluno-entrega.tar.gz

      - name: Preparar arquivos de ambiente
        run: |
          cp Portal-do-Aluno-entrega/backend/.env.example Portal-do-Aluno-entrega/backend/.env
          cp Portal-do-Aluno-entrega/frontend/.env.example Portal-do-Aluno-entrega/frontend/.env

      - name: Construir e iniciar os servicos
        run: docker compose -f Portal-do-Aluno-entrega/compose.yaml up -d --build

      - name: Verificar containers
        run: |
          sleep 10
          docker compose -f Portal-do-Aluno-entrega/compose.yaml ps
          docker compose -f Portal-do-Aluno-entrega/compose.yaml logs --no-color
          docker compose -f Portal-do-Aluno-entrega/compose.yaml ps --status running --services | grep -qx backend
          docker compose -f Portal-do-Aluno-entrega/compose.yaml ps --status running --services | grep -qx frontend

      - name: Testar resposta HTTP
        run: |
          for port in 8000 8001; do
            code=$(curl --retry 10 --retry-delay 3 --retry-connrefused -sS -o /dev/null -w "%{http_code}" http://localhost:$port/)
            echo "Porta $port: HTTP $code"
            test "$code" -ge 200 && test "$code" -lt 500
          done

      - name: Testar comunicacao entre frontend e backend
        run: |
          docker compose -f Portal-do-Aluno-entrega/compose.yaml exec -T frontend python -c "from urllib.request import urlopen; from urllib.error import HTTPError; url='http://backend:8000/api/integracoes/status/'; exec(\"try:\\n r=urlopen(url, timeout=10); status=r.status\\nexcept HTTPError as e:\\n status=e.code\"); print('Resposta do backend:', status); assert status in (200, 401, 403), f'Erro inesperado: {status}'"


      - name: Criar usuario temporario para teste
        run: |
          docker compose -f Portal-do-Aluno-entrega/compose.yaml exec -T backend python manage.py shell -c "from accounts.models import User; User.objects.filter(email='ci-test@example.com').delete(); User.objects.create_user(username='ci-test-user', email='ci-test@example.com', password='CI-Test-Password-123!', role=User.Role.STUDENT)"

      - name: Testar autenticacao e tokens JWT
        run: |
          docker compose -f Portal-do-Aluno-entrega/compose.yaml exec -T frontend python -c "import json, urllib.request; req=urllib.request.Request('http://backend:8000/api/auth/login/', data=json.dumps({'email':'ci-test@example.com','password':'CI-Test-Password-123!'}).encode(), headers={'Content-Type':'application/json'}); response=urllib.request.urlopen(req, timeout=10); data=json.loads(response.read()); assert response.status == 200 and 'access' in data and 'refresh' in data, 'Login ou tokens JWT inválidos'; print('LOGIN OK: tokens JWT recebidos')"

      - name: Testar renovacao automatica do JWT
        run: |
          docker compose -f Portal-do-Aluno-entrega/compose.yaml exec -T frontend python - <<'PY'
          import os
          import json
          from urllib.request import Request, urlopen

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "portal_aluno.settings")

          import django
          django.setup()

          from core.api_client import api_request

          login = Request(
              "http://backend:8000/api/auth/login/",
              data=json.dumps({
                  "email": "ci-test@example.com",
                  "password": "CI-Test-Password-123!"
              }).encode(),
              headers={"Content-Type": "application/json"}
          )

          with urlopen(login, timeout=10) as response:
              tokens = json.loads(response.read())

          refresh_original = tokens["refresh"]

          sessao = {
              "api_access": "token-expirado",
              "api_refresh": refresh_original
          }

          perfil = api_request(
              "me/",
              token="token-expirado",
              session=sessao
          )

          assert isinstance(perfil, dict), "Perfil não retornado"
          assert sessao["api_access"] != "token-expirado", "Access não renovado"
          assert sessao["api_refresh"] != refresh_original, "Refresh não rotacionado"

          print("JWT REFRESH OK: token renovado, rotacionado e API acessível.")
          PY

      - name: Encerrar containers
        if: always()
        run: docker compose -f Portal-do-Aluno-entrega/compose.yaml down -v
