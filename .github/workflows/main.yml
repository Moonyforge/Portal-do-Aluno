
name: Validacao Docker - Portal do Aluno

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Extrair pacote de entrega
        run: tar -xzf Portal-do-Aluno-entrega.tar.gz

      - name: Preparar arquivos de ambiente
        run: |
          cp Portal-do-Aluno-entrega/backend/.env.example Portal-do-Aluno-entrega/backend/.env
          cp Portal-do-Aluno-entrega/frontend/.env.example Portal-do-Aluno-entrega/frontend/.env

      - name: Construir e iniciar os servicos
        run: docker compose -f Portal-do-Aluno-entrega/compose.yaml up -d --build

      - name: Verificar containers
        run: |
          sleep 10
          docker compose -f Portal-do-Aluno-entrega/compose.yaml ps
          docker compose -f Portal-do-Aluno-entrega/compose.yaml logs --no-color
          docker compose -f Portal-do-Aluno-entrega/compose.yaml ps --status running --services | grep -qx backend
          docker compose -f Portal-do-Aluno-entrega/compose.yaml ps --status running --services | grep -qx frontend

      - name: Testar resposta HTTP
        run: |
          for port in 8000 8001; do
            code=$(curl --retry 10 --retry-delay 3 --retry-connrefused -sS -o /dev/null -w "%{http_code}" http://localhost:$port/)
            echo "Porta $port: HTTP $code"
            test "$code" -ge 200 && test "$code" -lt 500
          done

      - name: Testar comunicacao entre frontend e backend
        run: |
          docker compose -f Portal-do-Aluno-entrega/compose.yaml exec -T frontend python -c "from urllib.request import urlopen; from urllib.error import HTTPError; url='http://backend:8000/api/integracoes/status/'; exec(\"try:\\n r=urlopen(url, timeout=10); status=r.status\\nexcept HTTPError as e:\\n status=e.code\"); print('Resposta do backend:', status); assert status in (200, 401, 403), f'Erro inesperado: {status}'"


      - name: Encerrar containers
        if: always()
        run: docker compose -f Portal-do-Aluno-entrega/compose.yaml down -v
